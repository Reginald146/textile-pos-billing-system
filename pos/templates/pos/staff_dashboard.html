
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard | Textile POS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <a href="{% url 'staff_dashboard' %}" class="navbar-brand">Textile POS</a>
    <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
</nav>

<main class="container py-5">
    <h2>Staff Dashboard</h2>
    <p class="text-secondary">
        Welcome, {{ request.user.get_full_name|default:request.user.username }}.
    </p>

    <div class="row g-4 mt-2">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body p-4">
                    <h5>Billing Portal</h5>
                    <p class="text-secondary">
                        Create customer bills, select payment methods and print receipts.
                    </p>
                    <a href="{% url 'billing' %}" class="btn btn-primary">
                        Open Billing
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
